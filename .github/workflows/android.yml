name: Android

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  # Сборка APK не зависит от тестов: тестовый APK нужен, даже если проверки красные.
  apk:
    name: Сборка APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Карта берётся из репозитория (app/assets/map/map.json): километраж мест — основа зон,
      # якорей событий и фикстуры движка, поэтому в CI её больше не пересобираем из OSM.
      # Строгая проверка контента — в задаче «Проверки и тесты». Здесь она только предупреждает:
      # тестовый APK должен собираться, даже если валидатор нашёл расхождение.
      - name: Проверка контента (не блокирует сборку)
        working-directory: .
        continue-on-error: true
        run: python3 tools/content/validate.py --strict

      - name: Версия сборки
        run: grep -m1 '^version:' pubspec.yaml

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter --version
      - run: bash tool/bootstrap_android.sh
      - run: flutter pub get
      - run: flutter gen-l10n

      - name: Сборка
        env:
          APPMETRICA_KEY: ${{ secrets.APPMETRICA_KEY }}
        run: flutter build apk --release --build-number=${{ github.run_number }} --dart-define=APPMETRICA_KEY="$APPMETRICA_KEY"

      - name: Переименовать файл
        run: cp build/app/outputs/flutter-apk/app-release.apk putnik-test.apk

      - uses: actions/upload-artifact@v4
        with:
          name: putnik-apk
          path: app/putnik-test.apk
          retention-days: 30

  smoke:
    name: Запуск на эмуляторе
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: putnik-apk
          path: apk
      - name: Включить KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Установить, запустить, собрать журнал
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash app/tool/smoke_test.sh apk/putnik-test.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test
          path: smoke/

  # APK без архива: постоянная ссылка для телефона
  # https://github.com/<владелец>/<репозиторий>/releases/latest/download/putnik-test.apk
  # Выкладывается только после того, как APK установился и запустился на эмуляторе.
  release:
    name: Выложить APK
    needs: smoke
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: putnik-apk
          path: apk
      - name: Релиз «Последняя сборка»
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="$(grep -m1 '^version:' app/pubspec.yaml | sed 's/version: *//')"
          N="${V%%+*}.${{ github.run_number }}"
          gh release create "build-${{ github.run_number }}" apk/putnik-test.apk \
            --target "${{ github.sha }}" --latest \
            --title "Путник $N" \
            --notes "Сборка $V, запуск №${{ github.run_number }}. Скачай putnik-test.apk на телефон и открой — установится поверх, прогресс сохранится."
          # старые релизы-сборки не копим: оставляем 5 последних
          gh release list --limit 100 --json tagName --jq '.[].tagName' | grep '^build-' | tail -n +6 | while read -r t; do
            gh release delete "$t" --yes --cleanup-tag || true
          done
          retention-days: 14

  checks:
    name: Проверки и тесты
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Контент, локализация, слои, баланс
        working-directory: .
        run: |
          python3 tools/content/validate.py --strict
          python3 tools/check_l10n.py
          python3 tools/check_layers.py
          python3 tools/sim/simulate.py --days 28 --runs 10
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test
