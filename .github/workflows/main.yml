name: Android

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  # Сборка APK не зависит от тестов: тестовый APK нужен, даже если проверки красные.
  apk:
    name: Сборка APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Карта по реальным данным (OpenStreetMap + Natural Earth)
        working-directory: .
        continue-on-error: true
        timeout-minutes: 10
        run: python3 tools/map/build_map.py --online

      - name: Проверка контента
        working-directory: .
        run: python3 tools/content/validate.py --strict

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter --version
      - run: bash tool/bootstrap_android.sh
      - run: flutter pub get
      - run: flutter gen-l10n

      - name: Сборка
        env:
          APPMETRICA_KEY: ${{ secrets.APPMETRICA_KEY }}
        run: flutter build apk --release --build-number=${{ github.run_number }} --dart-define=APPMETRICA_KEY="$APPMETRICA_KEY"

      - name: Переименовать файл
        run: cp build/app/outputs/flutter-apk/app-release.apk putnik-test.apk

      - uses: actions/upload-artifact@v4
        with:
          name: putnik-apk
          path: app/putnik-test.apk
          retention-days: 30

  checks:
    name: Проверки и тесты
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Контент, локализация, слои, баланс
        working-directory: .
        run: |
          python3 tools/content/validate.py --strict
          python3 tools/check_l10n.py
          python3 tools/check_layers.py
          python3 tools/sim/simulate.py --days 28 --runs 10
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test
