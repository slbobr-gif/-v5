name: putnik
description: Путник — пешее путешествие от Кремля до Териберки на твоих шагах.
publish_to: none
version: 0.5.2+7

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_riverpod: ^2.5.1
  shared_preferences: ^2.2.3
  flutter_svg: ^2.0.10
  appmetrica_plugin: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/balance.json
    - assets/content/
    - assets/map/
    - assets/art/scenes/
    - assets/art/creatures/
    - assets/art/hero/
    - assets/art/onboarding/
    - assets/art/finale/
